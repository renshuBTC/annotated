<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Annotated.com</title>
<link rel="icon" href="icons/icon32.png">
<style>
@font-face {
  font-family: 'Newsreader Snip';
  font-style: normal;
  font-display: block;
  font-weight: 200 800;
  src: url(fonts/newsreader-vietnamese-opsz-normal.woff2) format('woff2-variations');
  unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB;
}
@font-face {
  font-family: 'Newsreader Snip';
  font-style: normal;
  font-display: block;
  font-weight: 200 800;
  src: url(fonts/newsreader-latin-ext-opsz-normal.woff2) format('woff2-variations');
  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
@font-face {
  font-family: 'Newsreader Snip';
  font-style: normal;
  font-display: block;
  font-weight: 200 800;
  src: url(fonts/newsreader-latin-opsz-normal.woff2) format('woff2-variations');
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

  :root { color-scheme: light dark; }
  body { margin: 0; width: 340px; font: 14px/1.45 'Newsreader Snip', Georgia, 'Times New Roman', serif; background: #1f1f1f; color: #f2f2f2; }
  body.win { width: auto; min-height: 100vh; display: grid; place-items: center; }
  .box { padding: 18px 20px 20px; }
  h1 { margin: 0 0 8px; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 9px; }
  h1 img { width: 22px; height: 22px; }
  p { margin: 0 0 10px; color: #d6d6d6; }
  .detail { font-size: 12px; color: #9a9a9a; word-break: break-word; }
  button { margin-top: 4px; border: 0; border-radius: 6px; padding: 8px 14px; background: #fff; color: #000; font: 600 13px/1 inherit; cursor: pointer; }
  button:hover { background: #e6e6e6; }
  kbd { font: 600 12px/1 inherit; padding: 2px 5px; border-radius: 4px; background: #3a3a3a; }
</style>
</head>
<body>
<div class="box">
  <h1><img src="icons/icon48.png" alt="">Can't snip this page</h1>
  <p id="msg"></p>
  <p class="detail" id="detail" hidden></p>
  <button id="act" hidden></button>
</div>
<script src="blocked.js"></script>
</body>
</html>
